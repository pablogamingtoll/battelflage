<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=1080,H=1920,CX=540,CY=960,AR=470,SPD=6;
const RAW="AF:Afghanistan,AL:Albania,DZ:Algeria,AD:Andorra,AO:Angola,AG:Antigua & Barbuda,AR:Argentina,AM:Armenia,AU:Australia,AT:Austria,AZ:Azerbaijan,BS:Bahamas,BH:Bahrain,BD:Bangladesh,BB:Barbados,BY:Belarus,BE:Belgium,BZ:Belize,BJ:Benin,BT:Bhutan,BO:Bolivia,BA:Bosnia & Herz.,BW:Botswana,BR:Brazil,BN:Brunei,BG:Bulgaria,BF:Burkina Faso,BI:Burundi,CV:Cabo Verde,KH:Cambodia,CM:Cameroon,CA:Canada,CF:Central African Rep.,TD:Chad,CL:Chile,CN:China,CO:Colombia,KM:Comoros,CG:Congo,CR:Costa Rica,CI:Ivory Coast,HR:Croatia,CU:Cuba,CY:Cyprus,CZ:Czechia,KP:North Korea,CD:DR Congo,DK:Denmark,DJ:Djibouti,DM:Dominica,DO:Dominican Rep.,EC:Ecuador,EG:Egypt,SV:El Salvador,GQ:Equatorial Guinea,ER:Eritrea,EE:Estonia,SZ:Eswatini,ET:Ethiopia,FJ:Fiji,FI:Finland,FR:France,GA:Gabon,GM:Gambia,GE:Georgia,DE:Germany,GH:Ghana,GR:Greece,GD:Grenada,GT:Guatemala,GN:Guinea,GW:Guinea-Bissau,GY:Guyana,HT:Haiti,HN:Honduras,HU:Hungary,IS:Iceland,IN:India,ID:Indonesia,IR:Iran,IQ:Iraq,IE:Ireland,IL:Israel,IT:Italy,JM:Jamaica,JP:Japan,JO:Jordan,KZ:Kazakhstan,KE:Kenya,KI:Kiribati,KW:Kuwait,KG:Kyrgyzstan,LA:Laos,LV:Latvia,LB:Lebanon,LS:Lesotho,LR:Liberia,LY:Libya,LI:Liechtenstein,LT:Lithuania,LU:Luxembourg,MG:Madagascar,MW:Malawi,MY:Malaysia,MV:Maldives,ML:Mali,MT:Malta,MH:Marshall Islands,MR:Mauritania,MU:Mauritius,MX:Mexico,FM:Micronesia,MC:Monaco,MN:Mongolia,ME:Montenegro,MA:Morocco,MZ:Mozambique,MM:Myanmar,NA:Namibia,NR:Nauru,NP:Nepal,NL:Netherlands,NZ:New Zealand,NI:Nicaragua,NE:Niger,NG:Nigeria,MK:North Macedonia,NO:Norway,OM:Oman,PK:Pakistan,PW:Palau,PA:Panama,PG:Papua New Guinea,PY:Paraguay,PE:Peru,PH:Philippines,PL:Poland,PT:Portugal,QA:Qatar,KR:South Korea,MD:Moldova,RO:Romania,RU:Russia,RW:Rwanda,KN:St Kitts & Nevis,LC:Saint Lucia,VC:St Vincent,WS:Samoa,SM:San Marino,ST:Sao Tome & Principe,SA:Saudi Arabia,SN:Senegal,RS:Serbia,SC:Seychelles,SL:Sierra Leone,SG:Singapore,SK:Slovakia,SI:Slovenia,SB:Solomon Islands,SO:Somalia,ZA:South Africa,SS:South Sudan,ES:Spain,LK:Sri Lanka,SD:Sudan,SR:Suriname,SE:Sweden,CH:Switzerland,SY:Syria,TJ:Tajikistan,TH:Thailand,TL:Timor-Leste,TG:Togo,TO:Tonga,TT:Trinidad & Tobago,TN:Tunisia,TR:Turkey,TM:Turkmenistan,TV:Tuvalu,UG:Uganda,UA:Ukraine,AE:UAE,GB:United Kingdom,TZ:Tanzania,US:United States,UY:Uruguay,UZ:Uzbekistan,VU:Vanuatu,VE:Venezuela,VN:Vietnam,YE:Yemen,ZM:Zambia,ZW:Zimbabwe";
const ALL=RAW.split(',').map(s=>{const[c,n]=s.split(':');return{c,n}});
const cache={};
(function(){if(!(document.fonts&&document.fonts.load))return;const txt=ALL.map(f=>String.fromCodePoint(...[...f.c].map(ch=>127397+ch.charCodeAt(0)))).join(' ')+' ⚔️🛡️💚';const clr=()=>{for(const k in cache)delete cache[k]};document.fonts.load('64px "Noto Color Emoji"',txt).then(clr).catch(()=>{});document.fonts.ready.then(clr)})();
function img(c){if(cache[c])return cache[c];const o=document.createElement('canvas');o.width=o.height=128;const x=o.getContext('2d');x.fillStyle='#223';x.fillRect(0,0,128,128);x.font='140px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0))),64,70);return cache[c]=o}
function flag(c,x,y,r){g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();g.drawImage(img(c),x-r,y-r,r*2,r*2);const gr=g.createRadialGradient(x-r*.3,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.2)');gr.addColorStop(1,'rgba(0,0,0,.28)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
/* audio */
let AC,muted=false,lastS=0;
function snd(f,d,type='square',v=.05,sl=0){if(muted||!AC)return;const T=AC.currentTime,o=AC.createOscillator(),k=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,T);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),T+d);k.gain.setValueAtTime(v,T);k.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(k);k.connect(AC.destination);o.start();o.stop(T+d)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.08),i*140))}
/* state */
const ROUNDS=10;
let st='menu',cfg={n:16},phase='rounds',roster=[],finalists=[],roundNo=1,timer=0,frame=0,champ=null,winner=null,label='';
let balls=[],parts=[],out=[],fts=[],pick=[],t=0,shake=0,rot=0,gapH=.1,gapCur=0,R0=42,dzVip=false;
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const dot=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const AB=['dash','shield','giant','heal'];
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30+Math.random()*20,c:col||'#ff6fb5'})}}
function ft(b,s){if(R0>=34)fts.push({x:b.x,y:b.y-b.r-30,s,l:50})}
function startMatch(list){
  const n=list.length;R0=n>=60?30:n>=30?36:n>=14?42:n>=8?50:62;
  balls=[];parts=[];out=[];fts=[];pick=[];t=0;shake=0;rot=Math.random()*6.283;gapH=Math.max(R0*1.15/AR,.06);gapCur=0;
  for(const f of list){let x,y,k=0,ok;do{const a=Math.random()*6.283,d=Math.sqrt(Math.random())*(AR-R0-10);x=CX+Math.cos(a)*d;y=CY+Math.sin(a)*d;ok=balls.every(b=>Math.hypot(b.x-x,b.y-y)>2*R0+2)}while(!ok&&++k<300);
    const v=Math.random()*6.283;balls.push({c:f.c,n:f.n,x,y,vx:Math.cos(v)*SPD,vy:Math.sin(v)*SPD,r:R0,r0:R0,hp:100,flash:0,ab:AB[Math.floor(Math.random()*4)],cd:300+Math.random()*700,sh:0,gi:0,dsh:0,sw:0,exit:false,ex:0,tr:[],vip:dzVip&&f.c==='DZ'})}
  st='play';snd(440,.2,'triangle',.06,300);
}
function useAb(b){const a=b.ab;if(a==='dash'){b.dsh=45;b.vx*=1.9;b.vy*=1.9}else if(a==='shield')b.sh=200;else if(a==='giant')b.gi=260;else b.hp=Math.min(100,b.hp+30);b.cd=700+Math.random()*500;ft(b,a.toUpperCase()+'!');snd(600,.15,'triangle',.05,400)}
function exitBall(b,nx,ny){b.exit=true;b.ex=35;b.vx=nx*7;b.vy=ny*7;out.unshift(b);burst(b.x,b.y,18,'#ff5a5a');snd(260,.45,'sawtooth',.07,-200);shake=10;ft(b,'OUT!')}
function popBall(b){b.exit=true;b.ex=0;out.unshift(b);burst(b.x,b.y,28,'#fff');snd(130,.3,'sawtooth',.07,-70);shake=14}
function step(live){
  shake*=.85;
  for(const b of balls){b.flash*=.85;if(b.exit){b.x+=b.vx;b.y+=b.vy;b.r*=.95;b.ex--}}
  if(live){
    t++;rot+=.0035;
    const ph=t%1500;
    if(t>7200){gapH=Math.min(gapH+.00025,.7);gapCur=gapH}
    else gapCur=ph<480?gapH*Math.max(0,Math.min(1,ph/40,(480-ph)/40)):0;
    const mult=1+Math.max(0,t-7200)/900;
    if(t%420===0&&pick.length<3){const a=Math.random()*6.283,d=Math.random()*(AR-80);pick.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,k:Math.floor(Math.random()*3)})}
    const L=balls.filter(b=>!b.exit);
    for(const b of L){
      b.sh--;b.gi--;b.dsh--;b.sw--;b.r+=(b.r0*(b.gi>0?1.45:1)-b.r)*.15;
      if(--b.cd<=0)useAb(b);
      b.x+=b.vx;b.y+=b.vy;
      const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy)||1;
      if(d>AR){exitBall(b,dx/d,dy/d);continue}
      if(d+b.r>AR){let a=Math.atan2(dy,dx)-rot;a=Math.atan2(Math.sin(a),Math.cos(a));
        if(b.vip&&b.solid===undefined&&Math.abs(a)<=gapCur)b.solid=Math.random()<.5;
        if(gapCur<.01||Math.abs(a)>gapCur||(b.vip&&b.solid)){const nx=dx/d,ny=dy/d,dp=b.vx*nx+b.vy*ny;if(dp>0){b.vx-=2*dp*nx;b.vy-=2*dp*ny;b.tr.push({x:CX+nx*AR,y:CY+ny*AR});if(b.tr.length>3)b.tr.shift()}b.x=CX+nx*(AR-b.r);b.y=CY+ny*(AR-b.r)}}else b.solid=undefined;
      const sp=Math.hypot(b.vx,b.vy),tg=(SPD+Math.min(t/1800,2.5))*(b.dsh>0?1.9:1);
      if(sp>0){const k=1+(tg/sp-1)*.08;b.vx*=k;b.vy*=k}
    }
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      const a=L[i],b=L[j];if(a.exit||b.exit)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
      if(d<m&&d>0){
        const nx=dx/d,ny=dy/d,ov=(m-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(rv>0){
          a.vx-=rv*nx;a.vy-=rv*ny;b.vx+=rv*nx;b.vy+=rv*ny;
          const base=(1.7+rv*.3)*mult,rn=()=>.8+Math.random()*.4;
          a.hp-=base*(b.sw>0?2:1)*(b.dsh>0?1.5:1)*(b.gi>0?1.4:1)*(a.sh>0?0:1)*(a.vip?.35:1)*(b.vip?1.3:1)*rn();
          b.hp-=base*(a.sw>0?2:1)*(a.dsh>0?1.5:1)*(a.gi>0?1.4:1)*(b.sh>0?0:1)*(b.vip?.35:1)*(a.vip?1.3:1)*rn();
          a.flash=b.flash=1;shake=Math.min(shake+2,10);
          burst((a.x+b.x)/2,(a.y+b.y)/2,4);
          const now=performance.now();if(now-lastS>35){snd(170+rv*15,.05,'square',.04);lastS=now}
        }
      }
    }
    for(const b of L)if(!b.exit&&b.hp<=0)popBall(b);
    for(let i=pick.length-1;i>=0;i--){const p=pick[i];
      for(const b of L){if(b.exit)continue;if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+26){
        if(p.k===0){b.sw=600}else if(p.k===1){b.sh=300}else b.hp=Math.min(100,b.hp+35);
        ft(b,['SWORD!','SHIELD!','HEAL!'][p.k]);snd(800,.15,'triangle',.06,500);pick.splice(i,1);break}}}
    const al=balls.filter(b=>!b.exit);
    if(al.length<=1)endMatch(al[0]||out[0]);
    else if(t>60*300)endMatch(al.sort((a,b)=>b.hp-a.hp)[0]);
  }
  balls=balls.filter(b=>!(b.exit&&b.ex<=0));
  for(const f of fts){f.y-=1.2;f.l--}fts=fts.filter(f=>f.l>0);
}
const sortR=a=>a.slice().sort((x,y)=>y.w-x.w||y.p-x.p);
const standings=()=>sortR(phase==='final'?finalists:roster).slice(0,5);
function endMatch(w){
  winner=w;st='result';timer=170;fanfare();burst(CX,CY,60,'#ffd35a');
  if(phase==='rounds'){const rk=[w,...out.filter(x=>x!==w)],n=rk.length;rk.forEach((b,i)=>{const r=roster.find(q=>q.c===b.c);if(r){r.p+=n-1-i;if(i===0)r.w++}})}
}
const pickN=n=>shuffle(ALL.filter(f=>f.c!=='DZ')).slice(0,n-1).concat(ALL.filter(f=>f.c==='DZ'));
function newSeason(n){cfg.n=n;roster=shuffle(pickN(n)).map(f=>({c:f.c,n:f.n,w:0,p:0}));roundNo=1;phase='rounds';finalists=[];startRound()}
function startRound(){dzVip=Math.random()<(phase==='final'?.25:.18);label=phase==='final'?'GRAND FINAL':'ROUND '+roundNo+' / '+ROUNDS;startMatch(phase==='final'?finalists:roster)}
function afterResult(){
  if(phase==='final'){champ=winner;st='champ';timer=600;fanfare();return}
  if(roundNo>=ROUNDS){phase='final';finalists=sortR(roster).slice(0,5)}else roundNo++;
  balls=[];out=[];pick=[];fts=[];st='wait';timer=600;
}
function update(){
  frame++;
  if(st==='play')step(true);
  else if(st==='result'){step(false);if(--timer<=0)afterResult()}
  else if(st==='wait'){if(--timer<=0)startRound()}
  else if(st==='champ'){if(--timer<=0)newSeason(cfg.n);else if(frame%22===0)burst(Math.random()*W,300+Math.random()*900,30,['#ffd35a','#ff5a8a','#5ad1ff','#7dff6a'][frame%4])}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l--}
  parts=parts.filter(p=>p.l>0);
}
/* drawing */
function txt(s,x,y,size,col='#fff',w=980,al='center'){g.font='800 '+size+'px system-ui,Arial,sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y,w)}
const BTN=[];
[8,16,32,64].forEach((n,i)=>BTN.push({x:90+i*230,y:900,w:210,h:130,s:n,fn:()=>newSeason(n)}));
function drawMenu(){
  txt('FLAG BATTLE',CX,300,120,'#ff5a5a');
  txt(ALL.length+' UN member states',CX,410,52,'#f2b72b');
  txt('10 rounds  →  Top 5 by wins  →  Grand Final',CX,520,42,'#fff');
  txt('Exit gate opens every few seconds · fall out = OUT',CX,585,34,'#9a9ab8');
  txt('CHOOSE CONTESTANTS',CX,820,56,'#f2b72b');
  for(const b of BTN){g.fillStyle='#8e1330';g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,28);g.fill();g.lineWidth=3;g.strokeStyle='#ff5a8a';g.stroke();txt(b.s,b.x+b.w/2,b.y+b.h/2,60,'#fff')}
  txt('Tap a number to start',CX,1160,44,'#9a9ab8');
}
const mm=()=>{const s=Math.floor(t/60);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function board(){
  const L=standings(),useAlive=st==='play'||st==='result';
  L.forEach((r,i)=>{const y=128+i*58,alive=!useAlive||balls.some(b=>b.c===r.c&&!b.exit);
    g.fillStyle=alive?'#8e1330':'#262a44';g.beginPath();g.roundRect(478,y-23,500,46,23);g.fill();
    flag(r.c,444,y,26);g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.arc(444,y,26,0,7);g.stroke();
    txt(r.n.toUpperCase(),500,y,31,'#fff',440,'left');txt(String(r.w),1032,y,44,'#ffd24a',60)});
}
function hud(){
  board();
  if(phase==='final'){txt('GRAND FINAL',36,150,36,'#f2b72b',380,'left');txt(st==='play'||st==='result'?mm():'00:00',30,245,124,'#ff5a5a',390,'left')}
  else{const rem=ROUNDS-roundNo+1;txt('GRAND FINAL IN',36,150,36,'#f2b72b',380,'left');txt(String(rem),30,245,170,'#ff5a5a',210,'left');txt(rem>1?'ROUNDS':'ROUND',String(rem).length*98+52,268,34,'#f2b72b',140,'left')}
  if(st==='wait')return;
  const al=balls.filter(b=>!b.exit).length;
  txt(label+'  ·  ALIVE '+al+'  ·  '+mm(),CX,425,36);
  const ph=t%1500,op=t>7200||ph<480;
  txt(t>7200?'EXIT OPEN':ph<480?'EXIT OPEN '+Math.ceil((480-ph)/60)+'s':'Exit opens in '+Math.ceil((1500-ph)/60)+'s',CX,468,34,op?'#7dff6a':'#9a9ab8');
}
function drawGame(){
  hud();
  g.save();
  if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.lineWidth=6;g.strokeStyle='#9a9ab8';g.shadowColor='#9a9ab8';g.shadowBlur=18;g.beginPath();
  if(gapCur<.01)g.arc(CX,CY,AR,0,7);else g.arc(CX,CY,AR,rot+gapCur,rot+6.283-gapCur);g.stroke();g.shadowBlur=0;
  if(gapCur>=.01)for(const s of[-1,1])dot(CX+Math.cos(rot+s*gapCur)*AR,CY+Math.sin(rot+s*gapCur)*AR,9,'#ff5a8a');
  if(balls.length<=32){for(const b of balls){if(b.exit)continue;b.tr.forEach((p,i)=>{g.strokeStyle='rgba(255,80,175,'+(.3+i*.25)+')';g.lineWidth=R0>=42?3:2;g.shadowColor='#ff3fa0';g.shadowBlur=R0>=42?14:0;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(p.x,p.y);g.stroke()})}g.shadowBlur=0}
  g.font='44px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(const p of pick){dot(p.x,p.y,28,'#000c');g.lineWidth=2;g.strokeStyle='#9a9ab8';g.stroke();g.fillText(['⚔️','🛡️','💚'][p.k],p.x,p.y+2)}
  for(const b of balls){
    flag(b.c,b.x,b.y,b.r);
    g.lineWidth=4;g.strokeStyle=b.flash>.1?'#fff':'rgba(255,255,255,.85)';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.stroke();
    if(b.flash>.1){g.fillStyle='rgba(255,255,255,'+b.flash*.5+')';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}
    if(b.sh>0){g.lineWidth=6;g.strokeStyle='#5ad1ff';g.beginPath();g.arc(b.x,b.y,b.r+7,0,7);g.stroke()}
    if(b.gi>0){g.lineWidth=5;g.strokeStyle='#ffd35a';g.beginPath();g.arc(b.x,b.y,b.r+7,0,7);g.stroke()}
    if(b.sw>0){const a=frame*.15;g.lineWidth=7;g.strokeStyle='#e8eef8';g.beginPath();g.moveTo(b.x+Math.cos(a)*b.r*.9,b.y+Math.sin(a)*b.r*.9);g.lineTo(b.x+Math.cos(a)*b.r*1.9,b.y+Math.sin(a)*b.r*1.9);g.stroke()}
    if(b.exit)continue;
    if(R0>=34){const w=b.r*1.7,x=b.x-w/2,y=b.y-b.r-18;g.fillStyle='#000a';g.fillRect(x-2,y-2,w+4,12);g.fillStyle=b.hp>50?'#3ddc84':b.hp>25?'#ffb020':'#ff4040';g.fillRect(x,y,w*Math.max(b.hp,0)/100,8)}
    if(R0>=50){const fs=Math.round(R0*.3);g.font='800 '+fs+'px system-ui,Arial';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#000';g.strokeText(b.n,b.x,b.y+b.r-fs,b.r*1.7);g.fillStyle='#fff';g.fillText(b.n,b.x,b.y+b.r-fs,b.r*1.7)}
  }
  for(const f of fts){g.globalAlpha=Math.min(f.l/20,1);g.font='800 28px system-ui,Arial';g.lineWidth=5;g.strokeStyle='#000';g.strokeText(f.s,f.x,f.y);g.fillStyle='#ffd35a';g.fillText(f.s,f.x,f.y)}
  g.globalAlpha=1;
  for(const p of parts){g.globalAlpha=Math.min(p.l/25,1);dot(p.x,p.y,4,p.c)}
  g.globalAlpha=1;g.restore();
  if(st!=='wait'){
    txt('ELIMINATED: '+out.length,CX,1510,40,'#9a9ab8');
    out.slice(0,12).forEach((b,i)=>{const x=170+(i%6)*148,y=1595+Math.floor(i/6)*100;flag(b.c,x,y,36);g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.arc(x,y,36,0,7);g.stroke()});
  }
  txt('⚔️ Sword x2 dmg   🛡️ Shield   💚 Heal',CX,1790,34,'#9a9ab8');
}
function draw(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  if(st==='menu')drawMenu();
  else if(st==='champ'){
    txt('🏆 GRAND CHAMPION',CX,420,92,'#f2b72b');
    const y=CY+Math.sin(frame/15)*10;flag(champ.c,CX,y,230);g.lineWidth=10;g.strokeStyle='#ff5a8a';g.beginPath();g.arc(CX,y,230,0,7);g.stroke();
    txt(champ.n.toUpperCase(),CX,1290,100);txt('Next season in '+Math.ceil(timer/60)+'s  ·  tap to skip',CX,1600,46,'#9a9ab8');
    for(const p of parts){g.globalAlpha=Math.min(p.l/25,1);dot(p.x,p.y,6,p.c)}g.globalAlpha=1;
  }
  else{drawGame();
    if(st==='wait'){txt(phase==='final'?'GRAND FINAL IN':'NEXT ROUND IN',CX,800,64,'#f2b72b');txt(String(Math.ceil(timer/60)),CX,990,260,'#ff5a5a');txt(phase==='final'?'TOP 5 BY WINS':'ROUND '+roundNo+' / '+ROUNDS,CX,1160,48,'#fff')}
    if(st==='result'&&winner){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,CY-120,W,240);flag(winner.c,230,CY,85);txt(phase==='final'?'CHAMPION':'ROUND WINNER',690,CY-55,46,'#f2b72b',620);txt(winner.n.toUpperCase(),690,CY+25,66,'#fff',620)}
  }
  txt(muted?'🔇':'🔊',1010,1860,52);
  if(st!=='menu')txt('✕',70,1860,52,'#9a9ab8');
}
cv.addEventListener('pointerdown',e=>{
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  if(AC&&AC.state==='suspended')AC.resume();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(x>940&&y>1790){muted=!muted;return}
  if(x<140&&y>1790&&st!=='menu'){st='menu';return}
  if(st==='menu'){for(const b of BTN)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){b.fn();break}}
  else if(st==='champ'||st==='wait'||st==='result')timer=0;
});
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(now-last,100);last=now;while(acc>=16.667){update();acc-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
